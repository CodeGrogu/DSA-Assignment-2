services:
  order-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: order_service
        PORT: 9091
    container_name: dsa-order-service
    ports:
      - "9091:9091"
    environment:
      PORT: 9091
      KAFKA_BROKER: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:9092
      MONGO_URI: mongodb://order_user:order_password@mongodb:27017/order_db?authSource=order_db&replicaSet=rs0
      BAL_CONFIG_VAR_MONGOURI: mongodb://order_user:order_password@mongodb:27017/order_db?authSource=order_db&replicaSet=rs0
    networks:
      - dsa-network

  customer-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: customer_service
        PORT: 9093
    container_name: dsa-customer-service
    ports:
      - "9093:9093"
    environment:
      PORT: 9093
      KAFKA_BROKER: kafka:9092
      MONGO_URI: mongodb://customer_user:customer_password@mongodb:27017/customer_db?authSource=customer_db&replicaSet=rs0
      BAL_CONFIG_VAR_MONGOHOST: mongodb
      BAL_CONFIG_VAR_MONGOPORT: 27017
      BAL_CONFIG_VAR_MONGOUSER: customer_user
      BAL_CONFIG_VAR_MONGOPASSWORD: customer_password
      BAL_CONFIG_VAR_DATABASENAME: customer_db
      BAL_CONFIG_VAR_MONGOAUTHSOURCE: customer_db
      BAL_CONFIG_VAR_ORDERSERVICEURL: http://order-service:9091
    networks:
      - dsa-network

  payment-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: payment_service
        PORT: 9094
    container_name: dsa-payment-service
    ports:
      - "9094:9094"
    environment:
      PORT: 9094
      KAFKA_BROKER: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:9092
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/payments_db?authSource=admin&replicaSet=rs0
      BAL_CONFIG_VAR_MONGOURI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/payments_db?authSource=admin&replicaSet=rs0
    networks:
      - dsa-network

  restaurant-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: restaurant_service
        PORT: 9095
    container_name: dsa-restaurant-service
    ports:
      - "9095:9095"
    environment:
      PORT: 9095
      KAFKA_BROKER: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:9092
      MONGO_URI: mongodb://restaurant_user:restaurant_password@mongodb:27017/restaurant_db?authSource=restaurant_db&replicaSet=rs0
      BAL_CONFIG_VAR_MONGOHOST: mongodb
      BAL_CONFIG_VAR_MONGOPORT: 27017
      BAL_CONFIG_VAR_MONGOUSER: restaurant_user
      BAL_CONFIG_VAR_MONGOPASSWORD: restaurant_password
      BAL_CONFIG_VAR_DATABASENAME: restaurant_db
      BAL_CONFIG_VAR_MONGOAUTHSOURCE: restaurant_db
    networks:
      - dsa-network

  delivery-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: delivery_service
        PORT: 9096
    container_name: dsa-delivery-service
    ports:
      - "9096:9096"
    environment:
      PORT: 9096
      KAFKA_BROKER: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BAL_CONFIG_VAR_KAFKABOOTSTRAPSERVERS: kafka:9092
      MONGO_URI: mongodb://delivery_user:delivery_password@mongodb:27017/delivery_db?authSource=delivery_db&replicaSet=rs0
      BAL_CONFIG_VAR_MONGOURI: mongodb://delivery_user:delivery_password@mongodb:27017/delivery_db?authSource=delivery_db&replicaSet=rs0
    networks:
      - dsa-network

  notification-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: notification_service
        PORT: 9097
    container_name: dsa-notification-service
    ports:
      - "9097:9097"
    environment:
      PORT: 9097
      KAFKA_BROKER: kafka:9092
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URI: mongodb://notification_user:notification_password@mongodb:27017/notification_db?authSource=notification_db&replicaSet=rs0
      BAL_CONFIG_VAR_MONGOURI: mongodb://notification_user:notification_password@mongodb:27017/notification_db?authSource=notification_db&replicaSet=rs0
    networks:
      - dsa-network

  admin-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: admin_service
        PORT: 9098
    container_name: dsa-admin-service
    ports:
      - "9098:9098"
    environment:
      PORT: 9098
      KAFKA_BROKER: kafka:9092
      MONGO_URI: mongodb://admin_user:admin_password@mongodb:27017/admin_db?authSource=admin_db&replicaSet=rs0
      ORDER_SERVICE_URL: http://order-service:9091
      PAYMENT_SERVICE_URL: http://payment-service:9094
      DELIVERY_SERVICE_URL: http://delivery-service:9096
    networks:
      - dsa-network

networks:
  dsa-network:
    external: true
