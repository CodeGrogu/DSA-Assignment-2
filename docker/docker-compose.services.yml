services:
  order-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_NAME: order_service
        PORT: 9091
    container_name: dsa-order-service
    ports:
      - "9091:9091"
    environment:
      PORT: 9091
      KAFKA_BROKER: kafka:9092
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017/orders_db?authSource=admin
    networks:
      - dsa-network

  customer-service:
