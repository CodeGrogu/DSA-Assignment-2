name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        run: |
          echo "=== Directive 3: Docker Compose Manifest Resiliency ==="
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          fi

          echo "Validating docker-compose.infra.yml..."
          docker compose -f docker-compose.infra.yml config -q
          echo "[PASS] docker-compose.infra.yml is valid."

          echo "Validating docker/docker-compose.services.yml..."
          docker compose -f docker/docker-compose.services.yml config -q
          echo "[PASS] docker/docker-compose.services.yml is valid."
          infra_network=$(docker compose -f docker-compose.infra.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["networks"]["dsa-network"]["name"])')
          services_network=$(docker compose -f docker/docker-compose.services.yml config --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["networks"]["dsa-network"]["name"])')
          test "$infra_network" = "$services_network"

  postman-lint:
    name: Postman Collection Schema Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate Postman Collections via Bun
        run: |
          echo "=== Directive 2: Strict Postman Collection Schema Linting via Bun ==="
          if [ -d "postman" ] && [ -n "$(find postman -name '*.json' 2>/dev/null)" ]; then
            echo "Found Postman collection files in postman/. Running strict schema validator..."
            bun -e '
              import fs from "fs";
              import path from "path";

              const postmanDir = "postman";
              const files = fs.readdirSync(postmanDir).filter(f => f.endsWith(".json"));
              let errorCount = 0;

              for (const file of files) {
                const fullPath = path.join(postmanDir, file);
                try {
                  const content = JSON.parse(fs.readFileSync(fullPath, "utf-8"));
                  if (!content.info || typeof content.info !== "object") {
                    console.error(`[ERROR] ${file}: Missing top-level "info" object.`);
                    errorCount++;
                    continue;
                  }
                  if (!content.info.name || typeof content.info.name !== "string") {
                    console.error(`[ERROR] ${file}: Missing or non-string "info.name".`);
                    errorCount++;
                    continue;
                  }
                  if (!content.info.schema || typeof content.info.schema !== "string") {
                    console.error(`[ERROR] ${file}: Missing or non-string "info.schema".`);
                    errorCount++;
                    continue;
                  }
                  if (!Array.isArray(content.item)) {
                    console.error(`[ERROR] ${file}: Missing or invalid "item" array.`);
                    errorCount++;
                    continue;
                  }
                  console.log(`[PASS] ${file}: Valid Postman collection (Name: "${content.info.name}", Items: ${content.item.length})`);
                } catch (err) {
                  console.error(`[ERROR] ${file}: Failed to parse JSON - ${err.message}`);
                  errorCount++;
                }
              }

              if (errorCount > 0) {
                console.error(`\nValidation failed: ${errorCount} error(s) found across collections.`);
                process.exit(1);
              } else {
                console.log(`\nAll Postman collections passed schema validation.`);
              }
            '
          else
            echo "No JSON collections found in 'postman/'. Skipping Postman schema linting cleanly."
          fi

  ballerina-ci:
    name: Ballerina Monorepo Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@v1.1.4
        with:
          version: 2201.13.5

      - name: Check Formatting Without Modifying Sources
        run: bash scripts/format-all.sh --check

      - name: "Phase A: Build, Test & Install Shared Modules"
        run: |
          echo "=== Directive 1 (Phase A): Shared Modules Topological Build ==="
          if [ -d "modules" ] && [ -n "$(find modules -mindepth 1 -maxdepth 2 -name 'Ballerina.toml' 2>/dev/null)" ]; then
            echo "Found shared modules in modules/. Starting topological build..."
            for mod in $(find modules -mindepth 1 -maxdepth 2 -name 'Ballerina.toml' -exec dirname {} \; | sort); do
              echo "----------------------------------------------------"
              echo "Building shared module: $mod"
              echo "----------------------------------------------------"
              pushd "$mod" > /dev/null

              echo "[1/3] Running automated unit tests with coverage..."
              bal test --test-report --code-coverage

              echo "[2/3] Packing module..."
              bal pack

              echo "[3/3] Publishing to local repository..."
              bal push --repository local

              popd > /dev/null
            done
            echo "Phase A completed successfully. All shared modules packed and published locally."
          else
            echo "No Ballerina packages found in 'modules/'. Skipping Phase A cleanly."
          fi

      - name: "Phase B: Build & Test Microservices"
        run: |
          echo "=== Directive 1 (Phase B): Microservices Build & Test ==="
          if [ -d "services" ] && [ -n "$(find services -mindepth 1 -maxdepth 2 -name 'Ballerina.toml' 2>/dev/null)" ]; then
            echo "Found microservices in services/. Starting build and test..."
            for svc in $(find services -mindepth 1 -maxdepth 2 -name 'Ballerina.toml' -exec dirname {} \; | sort); do
              echo "----------------------------------------------------"
              echo "Building microservice: $svc"
              echo "----------------------------------------------------"
              pushd "$svc" > /dev/null

              echo "[1/2] Running automated unit tests with coverage..."
              bal test --test-report --code-coverage

              echo "[2/2] Compiling package executable..."
              bal build

              popd > /dev/null
            done
            echo "Phase B completed successfully. All microservices compiled and tested."
          else
            echo "No Ballerina packages found in 'services/'. Skipping Phase B cleanly."
          fi

      - name: Verify Root Workspace Build
        run: bal build

      - name: Smoke Test Docker Runtime and Kafka Persistence
        timeout-minutes: 20
        run: |
          docker compose -f docker-compose.infra.yml up -d --wait
          docker compose -f docker/docker-compose.services.yml build
          for entry in order-service:9091 customer-service:9093 payment-service:9094 restaurant-service:9095 delivery-service:9096 notification-service:9097 admin-service:9098; do
            service="${entry%:*}"
            port="${entry#*:}"
            docker compose -f docker/docker-compose.services.yml up -d --no-deps "$service"
            curl --fail --silent --show-error --retry 12 --retry-connrefused --retry-delay 2 "http://localhost:${port}/health"
            docker compose -f docker/docker-compose.services.yml stop "$service"
          done

          docker exec dsa-kafka kafka-topics --bootstrap-server localhost:9092 --create --topic smoke.persistence --partitions 1 --replication-factor 1
          docker compose -f docker-compose.infra.yml up -d --no-deps --force-recreate kafka
          for attempt in $(seq 1 30); do
            if docker exec dsa-kafka kafka-topics --bootstrap-server localhost:9092 --describe --topic smoke.persistence; then
              exit 0
            fi
            sleep 2
          done
          echo "Kafka topic did not survive container recreation"
          exit 1

      - name: Docker Diagnostics on Failure
        if: failure()
        run: |
          docker compose -f docker-compose.infra.yml logs --tail=100 || true
          docker compose -f docker/docker-compose.services.yml logs --tail=100 || true

      - name: Clean Up CI Containers
        if: always()
        run: |
          docker compose -f docker/docker-compose.services.yml down || true
          docker compose -f docker-compose.infra.yml down --volumes || true

  pr-scope-validate:
    name: "PR Scope Report: ${{ github.head_ref || github.ref_name }}"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh 2>/dev/null || true

      - name: Generate PR Scope Report
        run: ./scripts/validate-pr-scope.sh
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
