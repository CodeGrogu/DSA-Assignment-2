ballerina-quality-gate:
    name: Ballerina Monorepo Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@v2
        with:
          version: 2201.10.0

      - name: Verify Ballerina Installation
        run: bal version

      - name: Build and Test Ballerina Packages
        run: bal pack
